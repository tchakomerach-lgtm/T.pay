name: T.Pay CI
on:
  # Keep the authoritative checks on main and the active CI remediation branch.
  push:
    branches:
      - main
      - fix/ci-compute-budget
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tpay_ci
          POSTGRES_DB: tpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tpay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TPAY_DATABASE_URL: postgresql://postgres:tpay_ci@127.0.0.1:5432/tpay_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and unit/invariant checks
        run: npm run check
      - name: Apply complete PostgreSQL migration chain and run live integration tests
        run: npm run test:postgres
      - name: Security fortress checks
        run: npm run security:fortress
      - name: Web production build
        run: npm run web:build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
