name: T.Pay CI
on:
  # Authoritative validation for every branch commit and every PR synchronization.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tpay_ci
          POSTGRES_DB: tpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tpay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TPAY_DATABASE_URL: postgresql://postgres:tpay_ci@127.0.0.1:5432/tpay_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm --prefix apps/universal install --no-audit --no-fund
      - run: npm run check
      - run: npm run web:smoke
      - run: npm run web:check
      - run: npm run api:check
      - run: npm --prefix apps/universal run typecheck
      - run: npm run universal:web:build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:web
      - run: npm audit --omit=dev --audit-level=high
