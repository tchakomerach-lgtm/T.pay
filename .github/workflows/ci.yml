name: T.Pay CI
on:
  push:
    branches:
      - main
      - investor/tpay-os-prototype
      - security/p057-admin-identity-breakglass-002
      - security/p058-data-compartment-fortress-003
      - security/p059-vault-access-broker-004
      - security/p060-admin-pam-executor-005
  pull_request:
    branches:
      - main
      - security/p057-admin-identity-breakglass-002
      - security/p058-data-compartment-fortress-003
      - security/p059-vault-access-broker-004
      - security/p060-admin-pam-executor-005
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tpay_ci
          POSTGRES_DB: tpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tpay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TPAY_DATABASE_URL: postgresql://postgres:tpay_ci@127.0.0.1:5432/tpay_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and unit/invariant checks
        run: npm run check
      - name: Apply full migration chain and run live PostgreSQL integration
        run: npm run test:postgres
      - name: Security fortress checks
        run: npm run security:fortress
      - name: Existing School/Web production build
        run: npm run web:build
      - name: Investor prototype production build
        run: npm run investor:build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
