name: T.Pay CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tpay_ci
          POSTGRES_DB: tpay_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tpay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TPAY_DATABASE_URL: postgresql://postgres:tpay_ci@127.0.0.1:5432/tpay_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Run live PostgreSQL integration tests
        run: npm test -- --test-name-pattern "L16 live PostgreSQL"
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload diagnostics on failure
        if: failure()
        run: |
          node --version
          npm --version
          git status --short
          find migrations -maxdepth 1 -type f | sort | tail -20
