name: T.Pay CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-ci-${{ github.ref }}
  # Queue newer commits instead of cancelling an active validation run.
  # A cancelled run is an orchestration outcome, not a compilation result.
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tpay_ci
          POSTGRES_DB: tpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tpay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TPAY_DATABASE_URL: postgresql://postgres:tpay_ci@127.0.0.1:5432/tpay_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
