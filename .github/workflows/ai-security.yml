name: T.Pay AI Security Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/ai/**"
      - "packages/security/**"
      - "tests/**"
      - "docs/security/**"
      - "docs/construction/**"
      - "AGENTS.md"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-ai-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ai-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: AI security regression suite
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Fail on committed secret material
        shell: bash
        run: |
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}'
          if git grep -nI -E -e "$pattern" -- . ':!*.md' ':!.github/workflows/ai-security.yml'; then
            echo "Potential secret material detected in tracked source files"
            exit 1
          fi
