name: T.Pay Android
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, feat/community-tontine-protection-ct042]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.11"
      - name: Build Android debug APK
        working-directory: android/tpay-shell
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify installable debug APK
        run: |
          test -s android/tpay-shell/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/tpay-shell/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable Android test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tpay-android-debug-${{ github.sha }}
          path: android/tpay-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
