name: T.Pay Android
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpay-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - name: Build Android debug APK
        working-directory: android/tpay-shell
        run: gradle :app:assembleDebug --no-daemon
